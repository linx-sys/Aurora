# ============================================================
#  Aurora CI — 构建测试 + 发布
#  push/PR：restore → build（主程序+卸载器）→ test
#  tag v*：上述流程 + publish 安装器 → GitHub Release
# ============================================================
name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-test:
    runs-on: windows-latest
    # 创建 Release 需要 GITHUB_TOKEN 具备 contents:write（默认只读会导致 403）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore AuroraPlayer.csproj

      - name: Build (AuroraPlayer)
        run: dotnet build AuroraPlayer.csproj -c Release --no-restore -v minimal

      - name: Build (Uninstaller)
        run: dotnet build unins.csproj -c Release -v minimal

      - name: Test
        run: dotnet test tests/Aurora.Tests.csproj -c Release -v minimal --nologo

      # tag 推送时继续走发布流程
      - name: Publish (Installer, win-x64)
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish installer.csproj -c Release -r win-x64 --self-contained false -v minimal

      - name: Publish (Portable, self-contained single file)
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet publish AuroraPlayer.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishDir=win-x64/portable/ -v minimal

      - name: Collect release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item win-x64/publish/AuroraPlayer-Setup.exe dist/AuroraPlayer-Setup.exe -Force
          Copy-Item win-x64/portable/AuroraPlayer.exe dist/Aurora-x64-Portable.exe -Force
          Compress-Archive -Path build/* -DestinationPath dist/Aurora-win64.zip -Force
          Get-ChildItem dist

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AuroraPlayer-Setup.exe
            dist/Aurora-x64-Portable.exe
            dist/Aurora-win64.zip
          generate_release_notes: true
