# ============================================================
#  Aurora CI — 构建测试 + 发布
#  push/PR：restore → build（主程序+卸载器）→ test
#  tag v*：上述流程 + publish 安装器 → GitHub Release
# ============================================================
name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore AuroraPlayer.csproj

      - name: Build (AuroraPlayer)
        run: dotnet build AuroraPlayer.csproj -c Release --no-restore -v minimal

      - name: Build (Uninstaller)
        run: dotnet build unins.csproj -c Release -v minimal

      - name: Test
        run: dotnet test tests/Aurora.Tests.csproj -c Release -v minimal --nologo

      # tag 推送时继续走发布流程
      - name: Publish (Installer, win-x64)
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish installer.csproj -c Release -r win-x64 --self-contained false -v minimal

      - name: Collect release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item win-x64/publish/AuroraPlayer-Setup.exe dist/ -Force
          Compress-Archive -Path build/* -DestinationPath dist/Aurora-Portable.zip -Force
          Get-ChildItem dist

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AuroraPlayer-Setup.exe
            dist/Aurora-Portable.zip
          generate_release_notes: true
